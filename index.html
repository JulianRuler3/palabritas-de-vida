<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palabritas de Vida</title>
<meta name="description" content="Una frase al día. Toca la tarjeta y vuelve mañana.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1322" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <canvas id="cielo" aria-hidden="true"></canvas>
  <div class="luz" aria-hidden="true"></div>

  <span class="logo" role="img" aria-label="Sión"></span>

  <main>
    <p class="fecha" id="fecha"></p>

    <button id="tarjeta" class="tarjeta" type="button">
      <span class="viento" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
      <span class="llama" id="llama" aria-hidden="true">
        <svg viewBox="0 0 40 56" width="40" height="56">
          <path class="llama-fuera" d="M20 2C20 2 6 18 6 33a14 14 0 0 0 28 0C34 18 20 2 20 2Z"/>
          <path class="llama-dentro" d="M20 22c0 0-7 8-7 15a7 7 0 0 0 14 0c0-7-7-15-7-15Z"/>
        </svg>
      </span>
      <span id="frase" class="frase" aria-live="polite" hidden></span>
      <span id="cita" class="cita" hidden></span>
      <span id="pista" class="pista">Ver la frase de hoy</span>
    </button>
  </main>

  <script src="./js/frases.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
